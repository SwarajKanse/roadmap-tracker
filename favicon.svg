<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="#121316"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(192, 193, 255, 0.15)" stroke-width="2"/>
  
  <!-- Outer Orbit Ring -->
  <circle cx="32" cy="32" r="20" stroke="rgba(128, 131, 255, 0.35)" stroke-width="2" stroke-dasharray="4 3"/>
  
  <!-- Core Cockpit Target -->
  <circle cx="32" cy="32" r="11" fill="rgba(128, 131, 255, 0.15)" stroke="#8083ff" stroke-width="2.5"/>
  
  <!-- Central Pulse Dot -->
  <circle cx="32" cy="32" r="4.5" fill="#c0c1ff"/>
  
  <!-- Orbiting Satellite Indicator -->
  <circle cx="48" cy="22" r="3.5" fill="#c0c1ff"/>
</svg>
