<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Obsidian Background -->
  <rect width="64" height="64" rx="16" fill="#121316"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(192, 193, 255, 0.2)" stroke-width="1.5"/>

  <!-- Subtle Inner Ambient Glow -->
  <circle cx="32" cy="32" r="18" fill="rgba(128, 131, 255, 0.12)" filter="blur(4px)"/>

  <!-- Calligraphic Devanagari 'अ' (Initial of अभ्यास) -->
  <text x="32" y="44" 
        font-family="'Rozha One', 'Yatra One', 'Noto Serif Devanagari', 'Mangal', serif" 
        font-size="34" 
        font-weight="bold" 
        fill="#c0c1ff" 
        text-anchor="middle"
        letter-spacing="0">अ</text>
</svg>
